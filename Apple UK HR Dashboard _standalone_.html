      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');

      setStatus('Error: missing bundle data');

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

      const entry = manifest[uuid];

        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;

            const ds = new DecompressionStream('gzip');

            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();

            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);

      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);

    // Parse the template and swap the root element. Scripts inserted via

    // createElement so they execute, awaiting onload for src scripts to

    const doc = new DOMParser().parseFromString(template, 'text/html');

ss=\"filter-chip__key\">Cohort<\u002Fspan>\n      <select id=\"filterCohort\"><option selected=\"\">All staff<\u002Foption><option>Retail floor<\u002Foption><option>Genius / technical<\u002Foption><option>Corporate HQ<\u002Foption><option>Online support<\u002Foption><option>Leadership<\u002Foption><\u002Fselect>\n      <span class=\"filter-chip__chev\">▾<\u002Fspan><\u002Fspan>\n    <button class=\"filter-bar__reset\" id=\"filterReset\">Reset<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<main id=\"main\">\n  <!-- LEVEL 1 -->\n  <section id=\"level-1\" class=\"level-section\">\n    <header class=\"page-header\">\n      <div class=\"page-header__eyebrow\">Level 1 · Descriptive<\u002Fdiv>\n      <h1>Twelve tiles. <em>One screen.<\u002Fem><br>Sixty seconds to act.<\u002Fh1>\n      <p class=\"page-header__sub\">Each tile traces back to the under-performing-unit narrative — UK Services growth, regional retail productivity dispersion, Galaxy AI substitution, UK wage inflation, and the Digital Markets Act asymmetry.<\u002Fp>\n      <div class=\"page-header__meta\">\n        <span><b>Period<\u002Fb> <span id=\"reportingPeriod\">Trailing 12M to Q2 FY26<\u002Fspan><\u002Fspan>\n        <span><b>Updated<\u002Fb> <span id=\"lastUpdated\">25 Apr 2026 · 09:42 BST<\u002Fspan><\u002Fspan>\n        <span><b>Role<\u002Fb> <span id=\"roleViewLabel\">CEO<\u002Fspan><\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fheader>\n    <div class=\"tile-grid\" id=\"tileGrid\" role=\"list\" aria-label=\"Executive summary tiles\"><\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- LEVEL 2 -->\n  <section id=\"level-2\" class=\"level-section is-hidden\">\n    <header class=\"page-header\">\n      <div class=\"page-header__eyebrow\">Level 2 · Diagnostic<\u002Fdiv>\n      <h1>Why is it <em>happening?<\u002Fem><\u002Fh1>\n      <p class=\"page-header__sub\">The Balanced Scorecard view (Kaplan &amp; Norton, 2005) drills from headline metrics into the four causal lenses: Financial · Customer · Internal Processes · Learning &amp; Growth.<\u002Fp>\n    <\u002Fheader>\n    <div class=\"scorecard\" id=\"scorecardGrid\"><\u002Fdiv>\n    <div class=\"scorecard\">\n      <div class=\"lite-panel\">\n        <div class=\"lite-panel__h\">Panel A · Strategic &amp; Financial<\u002Fdiv>\n        <h3>Revenue, margin, store productivity<\u002Fh3>\n        <ul>\n          <li><b>Revenue by product line<\u002Fb><span class=\"pip\">8-quarter stacked<\u002Fspan><\u002Fli>\n          <li><b>Gross margin trend<\u002Fb><span class=\"pip\">vs US<\u002Fspan><\u002Fli>\n          <li><b>UK store productivity heatmap<\u002Fb><span class=\"pip\">38–40 stores<\u002Fspan><\u002Fli>\n          <li><b>Online vs retail channel split<\u002Fb><span class=\"pip\">donut<\u002Fspan><\u002Fli>\n          <li><b>Sterling FX exposure<\u002Fb><span class=\"pip\">gauge<\u002Fspan><\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div class=\"lite-panel\">\n        <div class=\"lite-panel__h\">Panel C · Competitive<\u002Fdiv>\n        <h3>Market structure &amp; rivals<\u002Fh3>\n        <ul>\n          <li><b>UK smartphone share<\u002Fb><span class=\"pip\">line<\u002Fspan><\u002Fli>\n          <li><b>Premium-tier pricing<\u002Fb><span class=\"pip\">scatter<\u002Fspan><\u002Fli>\n          <li><b>Launch timeline<\u002Fb><span class=\"pip\">Gantt<\u002Fspan><\u002Fli>\n          <li><b>Share-of-voice<\u002Fb><span class=\"pip\">bar<\u002Fspan><\u002Fli>\n          <li><b>Competitor hiring velocity<\u002Fb><span class=\"pip\">LinkedIn<\u002Fspan><\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div class=\"lite-panel\">\n        <div class=\"lite-panel__h\">Panel D · External<\u002Fdiv>\n        <h3>Macro &amp; regulatory<\u002Fh3>\n        <ul>\n          <li><b>UK consumer confidence<\u002Fb><span class=\"pip\">ONS<\u002Fspan><\u002Fli>\n          <li><b>Regulatory watch<\u002Fb><span class=\"pip\">DMA · CMA · AI Act<\u002Fspan><\u002Fli>\n          <li><b>Supply chain disruption<\u002Fb><span class=\"pip\">gauge<\u002Fspan><\u002Fli>\n          <li><b>BoE base rate + wage inflation<\u002Fb><span class=\"pip\">dual-axis<\u002Fspan><\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div class=\"lite-panel\">\n        <div class=\"lite-panel__h\">Reading guide<\u002Fdiv>\n        <h3>Connecting the four lenses<\u002Fh3>\n        <p style=\"font-size:13px;color:var(--text-muted);line-height:1.55;margin:0\">The Balanced Scorecard reframes single-number performance as a chain: <b style=\"color:var(--text)\">Learning &amp; Growth<\u002Fb> capability feeds <b style=\"color:var(--text)\">Internal Process<\u002Fb> velocity, which produces <b style=\"color:var(--text)\">Customer<\u002Fb> outcomes that ultimately drive <b style=\"color:var(--text)\">Financial<\u002Fb> results. The Apple UK story sits at the second link — Services attach rates and store productivity dispersion are the bottleneck.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- LEVEL 3 -->\n  <section id=\"level-3\" class=\"level-section is-hidden\">\n    <header class=\"page-header\">\n      <div class=\"page-header__eyebrow\">Level 3 · Predictive &amp; Prescriptive<\u002Fdiv>\n      <h1>What will happen.<br><em>And what to do.<\u002Fem><\u002Fh1>\n      <p class=\"page-header__sub\">Six modules, each with a methodology &amp; limitations note: forecast method, assumptions, model drift risk, and the correlation-not-causation caveat.<\u002Fp>\n    <\u002Fheader>\n    <div class=\"l3-grid\" id=\"l3Grid\"><\u002Fdiv>\n  <\u002Fsection>\n<\u002Fmain>\n\n<!-- Slide-over sheet -->\n<div class=\"sheet-backdrop\" id=\"sheetBackdrop\"><\u002Fdiv>\n<aside class=\"sheet\" id=\"sheet\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"sheetTitle\">\n  <div class=\"sheet__head\">\n    <div>\n      <div class=\"sheet__eyebrow\" id=\"sheetEyebrow\">Tile detail<\u002Fdiv>\n      <div class=\"sheet__title\" id=\"sheetTitle\">—<\u002Fdiv>\n    <\u002Fdiv>\n    <button class=\"sheet__close\" id= launched ✓\", trend: \"down\", rag: \"amber\",\n      ragRationale: \"Imminent Galaxy AI launch in market window\",\n      narrative: \"Samsung Galaxy AI and Google Pixel AI directly target Apple's premium-tier 'no substitute' position.\",\n      events: [\n        { competitor: \"Samsung\", product: \"Galaxy S26 (UK)\",     status: \"37 days\", icon: \"▲\", rag: \"amber\" },\n        { competitor: \"Google\",  product: \"Pixel 10\",            status: \"Launched\", icon: \"✓\", rag: \"green\" },\n        { competitor: \"Xiaomi\",  product: \"15 Ultra UK push\",    status: \"Q3 FY26\", icon: \"→\", rag: \"green\" }\n      ],\n      source: \"Public launch calendars + Counterpoint Research UK monthly tracker\"\n    },\n    tile12_regulatoryRisk: {\n      label: \"Regulatory Risk\",\n      value: \"2 cases\", numericValue: 2, valueSuffix: \" cases\", valueDecimals: 0,\n      subValue: \"CMA open · DMA active\",\n      delta: \"+1 case YTD\", trend: \"up\", rag: \"red\",\n      ragRationale: \"Active CMA investigations + DMA designation create asymmetric UK exposure\",\n      narrative: \"Digital Markets Act creates one-way regulatory asymmetry vs US. Active CMA cases on App Store and mobile ecosystems.\",\n      items: [\n        { label: \"DMA compliance\",         status: \"Active\",        rag: \"amber\" },\n        { label: \"CMA App Store\",          status: \"Investigating\", rag: \"red\" },\n        { label: \"CMA mobile ecosystem\",   status: \"Investigating\", rag: \"red\" },\n        { label: \"UK AI Act alignment\",    status: \"Monitoring\",    rag: \"green\" }\n      ],\n      source: \"gov.uk Digital Markets, Competition and Consumers Act + CMA case tracker (live as at 25 Apr 2026)\"\n    }\n  }\n};\n\n/* Role-aware ordering + content emphasis swap */\nconst ROLE_ORDER = {\n  CEO:  [\"tile1_revenue\",\"tile3_servicesGrowth\",\"tile5_engagement\",\"tile9_alerts\",\"tile10_buRag\",\"tile11_competitorWatch\",\"tile12_regulatoryRisk\",\"tile6_attrition\",\"tile4_storeProductivity\",\"tile2_marketShare\",\"tile7_nps\",\"tile8_genderPayGap\"],\n  CFO:  [\"tile1_revenue\",\"tile3_servicesGrowth\",\"tile12_regulatoryRisk\",\"tile8_genderPayGap\",\"tile9_alerts\",\"tile4_storeProductivity\",\"tile10_buRag\",\"tile2_marketShare\",\"tile11_competitorWatch\",\"tile6_attrition\",\"tile5_engagement\",\"tile7_nps\"],\n  COO:  [\"tile4_storeProductivity\",\"tile1_revenue\",\"tile9_alerts\",\"tile3_servicesGrowth\",\"tile6_attrition\",\"tile5_engagement\",\"tile11_competitorWatch\",\"tile2_marketShare\",\"tile7_nps\",\"tile10_buRag\",\"tile12_regulatoryRisk\",\"tile8_genderPayGap\"],\n  CHRO: [\"tile5_engagement\",\"tile6_attrition\",\"tile8_genderPayGap\",\"tile9_alerts\",\"tile4_storeProductivity\",\"tile3_servicesGrowth\",\"tile7_nps\",\"tile1_revenue\",\"tile10_buRag\",\"tile11_competitorWatch\",\"tile12_regulatoryRisk\",\"tile2_marketShare\"]\n};\n\n/* Per-role content emphasis */\nconst ROLE_EMPHASIS = {\n  CFO: {\n    tile1_revenue: { label: \"UK Revenue · £ vs target\", subValue: \"£3.30bn target · −£160m gap\" },\n    tile3_servicesGrowth: { label: \"UK Services growth · margin lever\", subValue: \"~£180m revenue at risk vs US trajectory\" },\n    tile4_storeProductivity: { label: \"£/sq ft dispersion\", subValue: \"£4,710 spread between top and bottom 5\" },\n    tile8_genderPayGap: { label: \"Pay equity · disclosure risk\", subValue: \"Reportable threshold breached at parent entities\" }\n  },\n  CHRO: {\n    tile1_revenue: { label: \"Revenue per UK head\", subValue: \"~£525k / FTE · ~6,000 employees\" },\n    tile5_engagement: { label: \"Engagement · people lens\", subValue: \"72/100 · 81% intent-to-stay\" },\n    tile6_attrition: { label: \"Attrition · early-tenure watch\", subValue: \"8.4% headline · 18.2% in <12m cohort\" },\n    tile3_servicesGrowth: { label: \"Services growth · capability gap\", subValue: \"Front-line training + retail-to-services lift\" }\n  },\n  COO: {\n    tile4_storeProductivity: { label: \"Store productivity · ops lever\", subValue: \"London flagships pull 3.2× regional avg\" },\n    tile1_revenue: { label: \"Channel revenue throughput\", subValue: \"Retail 39% · Online 61% (12M)\" },\n    tile6_attrition: { label: \"Operational continuity\", subValue: \"Critical-role time-to-fill 47 days\" }\n  }\n};\n\n/* Filter effects on data — small, defensible, illustrative */\nfunction applyFilters(filters) {\n  const data = JSON.parse(JSON.stringify(DATA.level1));\n  const { period, bu, geo, cohort } = filters;\n\n  // Period scaling\n  if (period === \"Q\") {\n    data.tile1_revenue.value = \"£0.80bn\"; data.tile1_revenue.numericValue = 0.80;\n    data.tile1_revenue.subValue = \"Q2 FY26 · single quarter\";\n    data.tile3_servicesGrowth.delta = \"−4.9pp behind US (Q)\";\n    data.tile5_engagement.value = \"73\"; data.tile5_engagement.numericValue = 73;\n  } else if (period === \"YTD\") {\n    data.tile1_revenue.value = \"£1.57bn\"; data.tile1_revenue.numericValue = 1.57;\n    data.tile1_revenue.subValue = \"FY26 YTD (Oct 2025–present)\";\n  }\n\n  // BU scoping\n  if (bu === \"Retail\") {\n    data.tile1_revenue.value = \"£1.23bn\"; data.tile1_revenue.numericValue = 1.23;\n    data.tile1_revenue.subValue = \"Apple Retail UK Ltd · FY24 turnover\";\n    data.tile3_servicesGrowth.value = \"—\"; data.tile3_servicesGrowth.subValue = \"N/A for retail-only scope\";\n    data.tile3_servicesGrowth.numericValue = null; data.tile3_servicesGrowth.rag=\"green\";\n    data.tile7_nps.value = \"58\"; data.tile7_nps.numericValue = 58; data.tile7_nps.chart.value = 58;\n  } else if (bu === \"Services\") {\n    data.tile1_revenue.value = \"£420m\"; data.tile1_revenue.numericValue = 0.42;\n    data.tile1_revenue.subValue = \"Services UK estimated turnover\";\n    data.tile3_servicesGrowth.rag=\"red\"; data.tile3_servicesGrowth.ragRationale = \"Isolated Services view amplifies the gap\";\n  } else if (bu === \"Corporate / B2B\") {\n    data.tile1_revenue.value = \"£1.91bn\"; data.tile1_revenue.numericValue = 1.91;\n    data.tile1_revenue.subValue = \"Apple (UK) Ltd · FY24 turnover\";\n  } else if (bu === \"Online\") {\n    data.tile7_nps.value = \"65\"; data.tile7_nps.numericValue = 65; data.tile7_nps.chart.value = 65; data.tile7_nps.rag = \"green\";\n  }\n\n  // Geo scoping\n  if (geo === \"Scotland\") {\n    data.tile4_storeProductivity.value = \"1.4×\"; data.tile4_storeProductivity.numericValue = 1.4;\n    data.tile4_storeProductivity.rag = \"green\";\n    data.tile4_storeProductivity.subValue = \"Scotland · narrow spread\";\n  } else if (geo === \"England\") {\n    data.tile4_storeProductivity.value = \"3.6×\"; data.tile4_storeProductivity.numericValue = 3.6;\n    data.tile4_storeProductivity.subValue = \"London-flagship driven\";\n  }\n\n  // Cohort scoping\n  if (cohort === \"Retail floor\") {\n    data.tile6_attrition.value = \"12.1%\"; data.tile6_attrition.numericValue = 12.1;\n    data.tile6_attrition.rag = \"amber\"; data.tile6_attrition.subValue = \"Retail floor · above sector\";\n    data.tile5_engagement.value = \"68\"; data.tile5_engagement.numericValue = 68;\n  } else if (cohort === \"Genius / technical\") {\n    data.tile6_attrition.value = \"5.2%\"; data.tile6_attrition.numericValue = 5.2;\n    data.tile6_attrition.subValue = \"Genius technical · best in class\";\n  } else if (cohort === \"Leadership\") {\n    data.tile6_attrition.value = \"3.1%\"; data.tile6_attrition.numericValue = 3.1;\n    data.tile6_attrition.subValue = \"Leadership · low turnover\";\n    data.tile5_engagement.value = \"82\"; data.tile5_engagement.numericValue = 82;\n  }\n  return data;\n}\n\n/* ── SVG chart factories with hover ───────────── */\nfunction svgSparkline(data, idPrefix, opts={}) {\n  const w = 200, h = 60, pad = 4;\n  const min = Math.min(...data), max = Math.max(...data);\n  const range = max - min || 1;\n  const pts = data.map((v, i) => {\n    const x = (i / (data.length - 1)) * w;\n    const y = h - ((v - min) / range) * (h - pad * 2) - pad;\n    return [x, y];\n  });\n  const line = pts.map(p => p.join(',')).join(' ');\n  const area = `M0,${h} L${pts.map(p=>p.join(',')).join(' L')} L${w},${h} Z`;\n  const hovers = pts.map((p, i) => `<circle cx=\"${p[0]}\" cy=\"${p[1]}\" r=\"3\" class=\"chart-hover-pt\" data-i=\"${i}\" />`).join('');\n  const dots = pts.map((p, i) => `<rect x=\"${p[0]-10}\" y=\"0\" width=\"20\" height=\"${h}\" fill=\"transparent\" data-i=\"${i}\" data-v=\"${data[i]}\" data-l=\"${(opts.labels||[])[i]||''}\" data-u=\"${opts.unit||''}\" />`).join('');\n  return `<svg viewBox=\"0 0 ${w} ${h}\" preserveAspectRatio=\"none\">\n    <defs><linearGradient id=\"${idPrefix}-grad\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\">\n      <stop offset=\"0%\" stop-color=\"var(--accent)\" stop-opacity=\".18\"/>\n      <stop offset=\"100%\" stop-color=\"var(--accent)\" stop-opacity=\"0\"/>\n    <\u002FlinearGradient><\u002Fdefs>\n    <path d=\"${area}\" fill=\"url(#${idPrefix}-grad)\" />\n    <polyline points=\"${line}\" stroke=\"var(--accent)\" stroke-width=\"1.6\" stroke-linejoin=\"round\" stroke-linecap=\"round\" fill=\"none\" />\n    ${hovers}${dots}\n  <\u002Fsvg>`;\n}\nfunction svgDonut(value) {\n  const r = 36, c = 2 * Math.PI * r;\n  const filled = (value / 100) * c;\n  return `<svg viewBox=\"0 0 100 100\">\n    <circle cx=\"50\" cy=\"50\" r=\"${r}\" stroke=\"var(--surface-tint)\" stroke-width=\"10\" fill=\"none\" />\n    <circle cx=\"50\" cy=\"50\" r=\"${r}\" stroke=\"var(--accent)\" stroke-width=\"10\" fill=\"none\"\n            stroke-dasharray=\"${filled.toFixed(2)} ${(c - filled).toFixed(2)}\"\n            transform=\"rotate(-90 50 50)\" stroke-linecap=\"round\" />\n  <\u002Fsvg>`;\n}\nfunction svgTwoLine(payload, opts={}) {\n  const series = payload.series, labels = payload.labels || [];\n  const w = 200, h = 64, pad = 4;\n  const all = series.flatMap(s => s.data);\n  const min = Math.min(...all), max = Math.max(...all);\n  const range = max - min || 1;\n  const len = series[0].data.length;\n  const lines = series.map((s, i) => {\n    const pts = s.data.map((v, j) => {\n      const x = (j / (s.data.length - 1)) * w;\n      const y = h - ((v - min) / range) * (h - pad * 2) - pad;\n      return `${x.toFixed(1)},${y.toFixed(1)}`;\n    }).join(' ');\n    const color = i === 0 ? 'var(--accent)' : 'var(--text-muted)';\n    const dash = i === 1 ? 'stroke-dasharray=\"3 3\"' : '';\n    return `<polyline points=\"${pts}\" stroke=\"${color}\" stroke-width=\"1.6\" stroke-linejoin=\"round\" fill=\"none\" ${dash} />`;\n  }).join('');\n  const hits = Array.from({length:len}).map((_,j) => {\n    const x = (j / (len - 1)) * w;\n    const v0 = series[0].data[j], v1 = series[1] ? series[1].data[j] : '';\n    return `<rect x=\"${x-10}\" y=\"0\" width=\"20\" height=\"${h}\" fill=\"transparent\" data-i=\"${j}\" data-v=\"${v0}\" data-v2=\"${v1}\" data-l=\"${labels[j]||''}\" data-u=\"${payload.unit||opts.unit||''}\" data-name1=\"${series[0].name}\" data-name2=\"${series[1]?series[1].name:''}\" />`;\n  }).join('');\n  return `<svg viewBox=\"0 0 ${w} ${h}\" preserveAspectRatio=\"none\">${lines}${hits}<\u002Fsvg>`;\n}\nfunction svgGauge(opts) {\n  const { value, min, max, target } = opts;\n  const cx = 100, cy = 100, r = 80, sw = 12;\n  const pct = Math.max(0, Math.min(1, (value - min) / (max - min)));\n  const angle = (180 + pct * 180) * Math.PI / 180;\n  const ex = cx + r * Math.cos(angle), ey = cy + r * Math.sin(angle);\n  let tick = '';\n  if (target != null) {\n    const tA = (180 + ((target - min) / (max - min)) * 180) * Math.PI / 180;\n    const x1 = cx + (r - 14) * Math.cos(tA), y1 = cy + (r - 14) * Math.sin(tA);\n    const x2 = cx + (r + 8) * Math.cos(tA),  y2 = cy + (r + 8) * Math.sin(tA);\n    tick = `<line x1=\"${x1.toFixed(2)}\" y1=\"${y1.toFixed(2)}\" x2=\"${x2.toFixed(2)}\" y2=\"${y2.toFixed(2)}\" stroke=\"var(--text)\" stroke-width=\"1.5\" />`;\n  }\n  return `<svg viewBox=\"0 0 200 110\" class=\"gauge-svg\">\n    <path d=\"M ${cx-r} ${cy} A ${r} ${r} 0 0 1 ${cx+r} ${cy}\" stroke=\"var(--separator)\" stroke-width=\"${sw}\" fill=\"none\" stroke-linecap=\"round\" />\n    <path d=\"M ${cx-r} ${cy} A ${r} ${r} 0 0 1 ${ex.toFixed(2)} ${ey.toFixed(2)}\" stroke=\"var(--accent)\" stroke-width=\"${sw}\" fill=\"none\" stroke-linecap=\"round\" />\n    <circle cx=\"${ex.toFixed(2)}\" cy=\"${ey.toFixed(2)}\" r=\"${(sw/2 + 1).toFixed(1)}\" fill=\"var(--accent)\" />\n    ${tick}\n  <\u002Fsvg>`;\n}\n\n/* ── Helpers ─────────────────────────────────── */\nconst arrow = t => t === 'up' ? '↑' : t === 'down' ? '↓' : '→';\nconst dCls  = t => t === 'up' ? 'tile__delta--up' : t === 'down' ? 'tile__delta--down' : 'tile__delta--flat';\nconst esc   = s => String(s ?? '').replace(/&/g,'&amp;').replace(/<\u002Fg,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;');\nconst fmtGBP= n => Number(n).toLocaleString('en-GB');\n\nfunction tileHead(t) {\n  return `<div class=\"tile__head\">\n    <div class=\"tile__label\">${esc(t.label)}<\u002Fdiv>\n    <span class=\"tile__rag tile__rag--${t.rag}\" role=\"status\" aria-label=\"${esc(t.rag)}\"><\u002Fspan>\n  <\u002Fdiv>`;\n}\nfunction tileFoot(t) {\n  return `<div class=\"tile__foot\">\n    <div class=\"tile__source\">${esc(t.source)}<\u002Fdiv>\n    <div class=\"tile__updated\">${esc(DATA.meta.lastUpdatedDisplay)}<\u002Fdiv>\n  <\u002Fdiv>`;\n}\nfunction tileValueBlock(t) {\n  return `<div class=\"tile__value\" data-numeric=\"${t.numericValue ?? ''}\" data-prefix=\"${esc(t.valuePrefix||'')}\" data-suffix=\"${esc(t.valueSuffix||'')}\" data-decimals=\"${t.valueDecimals ?? 0}\">${esc(t.value)}<\u002Fdiv>\n    ${t.subValue ? `<div class=\"tile__sub\">${esc(t.subValue)}<\u002Fdiv>` : ''}\n    ${t.delta ? `<div class=\"tile__delta ${dCls(t.trend)}\"><span aria-hidden=\"true\">${arrow(t.trend)}<\u002Fspan> ${esc(t.delta)}<\u002Fdiv>` : ''}`;\n}\n\n/* ── Per-tile renderers ──────────────────────── */\nfunction renderTile(slug, t) {\n  let body = '';\n  switch (slug) {\n    case 'tile9_alerts': {\n      const items = t.alerts.map(a => `\n        <div class=\"alerts-list__item\">\n          <span class=\"alerts-list__sev ${a.severity === 'High' ? 'alerts-list__sev--high' : ''}\">${esc(a.severity.toUpperCase())}<\u002Fspan>\n          <div>\n            <div class=\"alerts-list__title\">${esc(a.title)}<\u002Fdiv>\n            <div class=\"alerts-list__owner\">${esc(a.owner)} · ${esc(a.id)}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>`).join('');\n      body = `<div class=\"tile__big\">${esc(t.value)}<\u002Fdiv>\n        ${t.subValue ? `<div class=\"tile__sub\">${esc(t.subValue)}<\u002Fdiv>` : ''}\n        ${t.delta ? `<div class=\"tile__delta ${dCls(t.trend)}\"><span aria-hidden=\"true\">${arrow(t.trend)}<\u002Fspan> ${esc(t.delta)}<\u002Fdiv>` : ''}\n        <div class=\"alerts-list\">${items}<\u002Fdiv>`;\n      break;\n    }\n    case 'tile10_buRag': {\n      const rows = t.units.map(u => `\n        <div class=\"bu-row\">\n          <span class=\"bu-row__dot tile__rag--${u.status}\" style=\"box-shadow:none;\"><\u002Fspan>\n          <span class=\"bu-row__name\">${esc(u.name)}<\u002Fspan>\n          <span class=\"bu-row__note\">${esc(u.note)}<\u002Fspan>\n        <\u002Fdiv>`).join('');\n      body = tileValueBlock(t) + `<div class=\"bu-list\">${rows}<\u002Fdiv>`;\n      break;\n    }\n    case 'tile11_competitorWatch': {\n      const rows = t.events.map(ev => `\n        <div class=\"comp-row\">\n          <span class=\"comp-row__icon comp-row__icon--${ev.rag}\" aria-hidden=\"true\">${esc(ev.icon)}<\u002Fspan>\n          <div>\n            <div class=\"comp-row__name\">${esc(ev.competitor)}<\u002Fdiv>\n            <div class=\"comp-row__sub\">${esc(ev.product)}<\u002Fdiv>\n          <\u002Fdiv>\n          <span class=\"comp-row__status\">${esc(ev.status)}<\u002Fspan>\n        <\u002Fdiv>`).join('');\n      body = tileValueBlock(t) + `<div class=\"comp-list\">${rows}<\u002Fdiv>`;\n      break;\n    }\n    case 'tile12_regulatoryRisk': {\n      const rows = t.items.map(it => `\n        <div class=\"reg-row\">\n          <span class=\"reg-row__label\">${esc(it.label)}<\u002Fspan>\n          <span class=\"reg-row__status reg-row__status--${it.rag}\">${esc(it.status)}<\u002Fspan>\n        <\u002Fdiv>`).join('');\n      body = tileValueBlock(t) + `<div class=\"reg-list\">${rows}<\u002Fdiv>`;\n      break;\n    }\n    default: {\n      const k = t.chart && t.chart.type;\n      let viz = '';\n      if (k === 'sparkline') viz = `<div class=\"tile__chart\" data-chart=\"sparkline\">${svgSparkline(t.chart.data, slug, {labels:t.chart.labels, unit:t.chart.unit})}<div class=\"chart-tt\"><\u002Fdiv><\u002Fdiv>`;\n      else if (k === 'donut') viz = `<div class=\"tile__chart donut-wrap\">${svgDonut(t.chart.value)}<div class=\"donut-center\"><div class=\"donut-center__num\">${t.chart.value}%<\u002Fdiv><div class=\"donut-center__lbl\">${esc(t.chart.label)}<\u002Fdiv><\u002Fdiv><\u002Fdiv>`;\n      else if (k === 'twoLine') viz = `<div class=\"tile__chart\" data-chart=\"twoLine\">${svgTwoLine(t.chart)}<div class=\"chart-tt\"><\u002Fdiv><\u002Fdiv>`;\n      else if (k === 'gauge') viz = `<div class=\"tile__chart gauge-wrap\">${svgGauge(t.chart)}<div class=\"gauge-center\"><div class=\"gauge-center__num\">${esc(t.value)}<\u002Fdiv><div class=\"gauge-center__lbl\">target ${esc(t.chart.target)}<\u002Fdiv><\u002Fdiv><\u002Fdiv>`;\n      else if (k === 'miniBar') {\n        const max = Math.max(...t.chart.data);\n        viz = `<div class=\"cmp-bars\">` + t.chart.labels.map((lbl, i) => {\n          const pct = (t.chart.data[i] / max) * 100;\n          const cls = i === 0 ? 'cmp-row__fill' : 'cmp-row__fill cmp-row__fill--muted';\n          return `<div class=\"cmp-row\">\n            <div class=\"cmp-row__lbl\">${esc(lbl)}<\u002Fdiv>\n            <div class=\"cmp-row__bar\"><div class=\"${cls}\" style=\"width:${pct.toFixed(1)}%\"><\u002Fdiv><\u002Fdiv>\n            <div class=\"cmp-row__val\">+${t.chart.data[i]}${esc(t.chart.unit)}<\u002Fdiv>\n          <\u002Fdiv>`;\n        }).join('') + `<\u002Fdiv>`;\n      }\n      else if (k === 'hbar') {\n        const max = Math.max(...t.chart.data);\n        viz = `<div class=\"hbar-wrap\">` + t.chart.labels.map((lbl, i) => {\n          const pct = (t.chart.data[i] / max) * 100;\n          const cls = i === 0 ? 'hbar-row__fill' : 'hbar-row__fill hbar-row__fill--muted';\n          return `<div class=\"hbar-row\">\n            <div class=\"hbar-row__top\">\n              <span class=\"hbar-row__name\">${esc(lbl)}<\u002Fspan>\n              <span class=\"hbar-row__val\">£${fmtGBP(t.chart.data[i])} ${esc(t.chart.unit)}<\u002Fspan>\n            <\u002Fdiv>\n            <div class=\"hbar-row__bar\"><div class=\"${cls}\" style=\"width:${pct.toFixed(1)}%\"><\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>`;\n        }).join('') + `<p class=\"hbar-note\">Flagships: Battersea HQ · Regent St · Covent Garden · Westfield London · Brent Cross.<\u002Fp><\u002Fdiv>`;\n      }\n      body = tileValueBlock(t) + viz;\n    }\n  }\n  return `<article class=\"tile\" role=\"listitem\" aria-label=\"${esc(t.label)}\" data-tile=\"${slug}\" tabindex=\"0\">\n    ${tileHead(t)}${body}${tileFoot(t)}\n  <\u002Farticle>`;\n}\n\n/* ── State + render ──────────────────────────── */\nconst state = {\n  role: 'CEO',\n  filters: { period: '12M', bu: 'All', geo: 'UK', cohort: 'All staff' }\n};\n\nfunction renderLevel1() {\n  const order = ROLE_ORDER[state.role] || ROLE_ORDER.CEO;\n  const data = applyFilters(state.filters);\n\n  // Apply role emphasis on labels/subValues\n  const emph = ROLE_EMPHASIS[state.role] || {};\n  Object.keys(emph).forEach(k => {\n    if (data[k]) Object.assign(data[k], emph[k]);\n  });\n\n  const grid = document.getElementById('tileGrid');\n  grid.innerHTML = order.map(slug => renderTile(slug, data[slug])).join('');\n  document.getElementById('roleViewLabel').textContent = state.role;\n\n  // reveal observer\n  const tiles = grid.querySelectorAll('.tile');\n  if ('IntersectionObserver' in window) {\n    const obs = new IntersectionObserver((entries) => {\n      entries.forEach((e, i) => {\n        if (e.isIntersecting) {\n          setTimeout(() => e.target.classList.add('is-revealed'), i * 30);\n          obs.unobserve(e.target);\n        }\n      });\n    }, { threshold: 0.1 });\n    tiles.forEach(t => obs.observe(t));\n  } else {\n    tiles.forEach(t => t.classList.add('is-revealed'));\n  }\n\n  wireTileEvents();\n}\n\nfunction wireTileEvents() {\n  // Click → drill-down sheet\n  document.querySelectorAll('.tile').forEach(tile => {\n    tile.addEventListener('click', () => openSheet(tile.dataset.tile));\n    tile.addEventListener('keydown', e => {\n      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openSheet(tile.dataset.tile); }\n    });\n  });\n  // Chart hover tooltip\n  document.querySelectorAll('.tile__chart[data-chart]').forEach(wrap => {\n    const tt = wrap.querySelector('.chart-tt');\n    const svg = wrap.querySelector('svg');\n    if (!svg || !tt) return;\n    const hits = svg.querySelectorAll('rect[data-i]');\n    const dots = svg.querySelectorAll('.chart-hover-pt');\n    hits.forEach(rect => {\n      rect.addEventListener('mouseenter', () => {\n        const i = +rect.dataset.i;\n        const v = rect.dataset.v, v2 = rect.dataset.v2 || '', l = rect.dataset.l, u = rect.dataset.u;\n        const n1 = rect.dataset.name1, n2 = rect.dataset.name2;\n        const html = n1\n          ? `<b>${esc(l)}<\u002Fb> · ${esc(n1)} ${v}${u}${v2?` · ${esc(n2)} ${v2}${u}`:''}`\n          : `<b>${esc(l)}<\u002Fb> · ${v}${u}`;\n        tt.innerHTML = html;\n        const r = rect.getBoundingClientRect(), w = wrap.getBoundingClientRect();\n        tt.style.left = (r.left - w.left + r.width/2) + 'px';\n        tt.style.top  = (r.top - w.top + r.height/2) + 'px';\n        tt.classList.add('is-on');\n        if (dots[i]) dots[i].classList.add('is-on');\n      });\n      rect.addEventListener('mouseleave', () => {\n        tt.classList.remove('is-on');\n        const i = +rect.dataset.i;\n        if (dots[i]) dots[i].classList.remove('is-on');\n      });\n    });\n  });\n}\n\n/* ── Drill-down sheet ────────────────────────── */\nfunction openSheet(slug) {\n  const t = applyFilters(state.filters)[slug];\n  if (!t) return;\n  document.getElementById('sheetEyebrow').textContent = (t.label || '').toUpperCase();\n  document.getElementById('sheetTitle').textContent = t.label || '';\n\n  const ragLabel = { green:'Within target band', amber:'Watch', red:'Critical' }[t.rag] || '';\n  const heroVal = t.value || '—';\n\n  let chartHtml = '';\n  if (t.chart) {\n    if (t.chart.type === 'sparkline') chartHtml = svgSparkline(t.chart.data, slug+'-sheet', {labels:t.chart.labels, unit:t.chart.unit});\n    else if (t.chart.type === 'twoLine') chartHtml = svgTwoLine(t.chart);\n    else if (t.chart.type === 'donut') chartHtml = svgDonut(t.chart.value);\n    else if (t.chart.type === 'gauge') chartHtml = svgGauge(t.chart);\n    else if (t.chart.type === 'miniBar') {\n      const max = Math.max(...t.chart.data);\n      chartHtml = `<div class=\"cmp-bars\" style=\"margin:0\">` + t.chart.labels.map((lbl,i)=>{\n        const pct = (t.chart.data[i]/max)*100;\n        return `<div class=\"cmp-row\"><div class=\"cmp-row__lbl\">${esc(lbl)}<\u002Fdiv><div class=\"cmp-row__bar\"><div class=\"cmp-row__fill ${i===1?'cmp-row__fill--muted':''}\" style=\"width:${pct}%\"><\u002Fdiv><\u002Fdiv><div class=\"cmp-row__val\">+${t.chart.data[i]}${esc(t.chart.unit)}<\u002Fdiv><\u002Fdiv>`;\n      }).join('')+`<\u002Fdiv>`;\n    }\n    else if (t.chart.type === 'hbar') {\n      const max = Math.max(...t.chart.data);\n      chartHtml = `<div class=\"hbar-wrap\" style=\"margin:0\">` + t.chart.labels.map((lbl,i)=>{\n        const pct = (t.chart.data[i]/max)*100;\n        return `<div class=\"hbar-row\"><div class=\"hbar-row__top\"><span class=\"hbar-row__name\">${esc(lbl)}<\u002Fspan><span class=\"hbar-row__val\">£${fmtGBP(t.chart.data[i])} ${esc(t.chart.unit)}<\u002Fspan><\u002Fdiv><div class=\"hbar-row__bar\"><div class=\"hbar-row__fill ${i===1?'hbar-row__fill--muted':''}\" style=\"width:${pct}%\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>`;\n      }).join('')+`<\u002Fdiv>`;\n    }\n  }\n\n  const kvHtml = (t.kv || []).map(([k,v]) => `<dt>${esc(k)}<\u002Fdt><dd>${esc(v)}<\u002Fdd>`).join('');\n  const alertsHtml = t.alerts ? t.alerts.map(a => `<div class=\"alerts-list__item\"><span class=\"alerts-list__sev ${a.severity==='High'?'alerts-list__sev--high':''}\">${esc(a.severity.toUpperCase())}<\u002Fspan><div><div class=\"alerts-list__title\">${esc(a.title)}<\u002Fdiv><div class=\"alerts-list__owner\">${esc(a.owner)} · ${esc(a.id)}<\u002Fdiv><\u002Fdiv><\u002Fdiv>`).join('') : '';\n  const unitsHtml = t.units ? t.units.map(u=>`<div class=\"bu-row\"><span class=\"bu-row__dot tile__rag--${u.status}\" style=\"box-shadow:none;\"><\u002Fspan><span class=\"bu-row__name\">${esc(u.name)}<\u002Fspan><span class=\"bu-row__note\">${esc(u.note)}<\u002Fspan><\u002Fdiv>`).join('') : '';\n\n  document.getElementById('sheetBody').innerHTML = `\n    <div class=\"sheet__hero\">\n      <div class=\"sheet__heroVal\">${esc(heroVal)}<\u002Fdiv>\n      ${t.subValue ? `<div class=\"sheet__heroSub\">${esc(t.subValue)}<\u002Fdiv>`: ''}\n    <\u002Fdiv>\n    <div class=\"sheet__rag\"><span class=\"tile__rag tile__rag--${t.rag}\" style=\"margin:0\"><\u002Fspan> ${esc(ragLabel)} · ${esc(t.ragRationale||'')}<\u002Fdiv>\n\n    ${chartHtml ? `<div class=\"sheet__section\"><div class=\"sheet__h\">Trend<\u002Fdiv><div class=\"sheet__chartBig\">${chartHtml}<\u002Fdiv><\u002Fdiv>` : ''}\n\n    <div class=\"sheet__section\"><div class=\"sheet__h\">Narrative<\u002Fdiv>\n      <p class=\"sheet__p\">${esc(t.narrative||'')}<\u002Fp><\u002Fdiv>\n\n    ${kvHtml ? `<div class=\"sheet__section\"><div class=\"sheet__h\">Breakdown<\u002Fdiv><dl class=\"sheet__kv\">${kvHtml}<\u002Fdl><\u002Fdiv>` : ''}\n    ${alertsHtml ? `<div class=\"sheet__section\"><div class=\"sheet__h\">Active alerts<\u002Fdiv><div class=\"alerts-list\" style=\"margin:0\">${alertsHtml}<\u002Fdiv><\u002Fdiv>` : ''}\n    ${unitsHtml ? `<div class=\"sheet__section\"><div class=\"sheet__h\">Segments<\u002Fdiv><div class=\"bu-list\" style=\"margin:0\">${unitsHtml}<\u002Fdiv><\u002Fdiv>` : ''}\n\n    <div class=\"sheet__section\"><div class=\"sheet__h\">Source<\u002Fdiv>\n      <div class=\"sheet__src\">${esc(t.source||'')}<\u002Fdiv><\u002Fdiv>\n  `;\n  document.getElementById('sheetBackdrop').classList.add('is-open');\n  document.getElementById('sheet').classList.add('is-open');\n  document.body.style.overflow = 'hidden';\n}\nfunction closeSheet() {\n  document.getElementById('sheetBackdrop').classList.remove('is-open');\n  document.getElementById('sheet').classList.remove('is-open');\n  document.body.style.overflow = '';\n}\n\n/* ── Level 2 render ──────────────────────────── */\nconst BSC = [\n  { h:\"Financial\", title:\"Financial\", metrics:[\n    { name:\"UK labour cost % of revenue\", sub:\"Target ≤ 14%\", val:\"15.2%\", pct:90, rag:\"amber\" },\n    { name:\"Wage inflation impact\", sub:\"Margin drag YoY\", val:\"−0.6pp\", pct:60, rag:\"amber\" },\n    { name:\"Training spend per head\", sub:\"vs sector £1,180\", val:\"£1,420\", pct:78, rag:\"green\" },\n    { name:\"Gender pay gap (mean / median)\", sub:\"Overall UK\", val:\"14% / 19%\", pct:55, rag:\"amber\" }\n  ]},\n  { h:\"Customer\", title:\"Customer\", metrics:[\n    { name:\"Retail NPS\", sub:\"Channel-level\", val:\"58\", pct:79, rag:\"amber\" },\n    { name:\"Services attach rate / store\", sub:\"Top quartile vs bottom\", val:\"2.4×\", pct:72, rag:\"amber\" },\n    { name:\"CSAT — Online\", sub:\"vs Retail 86%\", val:\"91%\", pct:91, rag:\"green\" },\n    { name:\"Genius Bar NPS\", sub:\"In-store technical\", val:\"72\", pct:86, rag:\"green\" }\n  ]},\n  { h:\"Internal Processes\", title:\"Internal Processes\", metrics:[\n    { name:\"Time-to-fill critical roles\", sub:\"Target 35 days\", val:\"47 d\", pct:75, rag:\"amber\" },\n    { name:\"Onboarding velocity (retail)\", sub:\"Pre-Christmas seasonal\", val:\"11 d\", pct:88, rag:\"green\" },\n    { name:\"Internal mobility (retail→corp)\", sub:\"FY26 YTD\", val:\"3.4%\", pct:48, rag:\"red\" },\n    { name:\"Manager span of control\", sub:\"Median\", val:\"8.1\", pct:82, rag:\"green\" }\n  ]},\n  { h:\"Learning & Growth\", title:\"Learning & Growth\", metrics:[\n    { name:\"ADDIE-evaluated completion\", sub:\"Mandatory + role-based\", val:\"94%\", pct:94, rag:\"green\" },\n    { name:\"Kirkpatrick L3 behaviour change\", sub:\"Manager observation\", val:\"61%\", pct:61, rag:\"amber\" },\n    { name:\"Engagement (Retail floor)\", sub:\"vs HQ 78\", val:\"68\", pct:68, rag:\"amber\" },\n    { name:\"Attrition <12-month tenure\", sub:\"Watch cohort\", val:\"18.2%\", pct:30, rag:\"red\" }\n  ]}\n];\nfunction renderLevel2() {\n  const grid = document.getElementById('scorecardGrid');\n  grid.innerHTML = BSC.map(card => `\n    <div class=\"bsc-card\">\n      <div class=\"bsc-card__head\">\n        <div>\n          <div class=\"bsc-card__h\">${esc(card.h)}<\u002Fdiv>\n          <div class=\"bsc-card__title\">${esc(card.title)}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      ${card.metrics.map(m => `\n        <div class=\"bsc-metric\">\n          <div class=\"bsc-metric__name\">${esc(m.name)}<small>${esc(m.sub)}<\u002Fsmall><\u002Fdiv>\n          <div class=\"bsc-metric__val\">${esc(m.val)}<\u002Fdiv>\n          <div class=\"bsc-metric__bar\"><div class=\"bsc-metric__fill bsc-metric__fill--${m.rag}\" style=\"width:0%\" data-target=\"${m.pct}\"><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      `).join('')}\n    <\u002Fdiv>\n  `).join('');\n  // animate fills\n  setTimeout(() => {\n    grid.querySelectorAll('.bsc-metric__fill').forEach(f => {\n      f.style.width = f.dataset.target + '%';\n    });\n  }, 80);\n}\n\n/* ── Level 3: 6 modules ─────────────────────── */\nfunction renderLevel3() {\n  const root = document.getElementById('l3Grid');\n  root.innerHTML = `\n    <!-- Module 1: Revenue forecast -->\n    <div class=\"l3-card\" id=\"m1\">\n      <div class=\"l3-card__h\">Module 1<\u002Fdiv>\n      <div class=\"l3-card__title\">UK Revenue Forecast<\u002Fdiv>\n      <div class=\"l3-card__sub\">6 months forward · 80% confidence band · trend + leading-indicator regression on UK consumer confidence, FX and prior-period attach rate.<\u002Fdiv>\n      <div class=\"l3-segs\" role=\"tablist\">\n        <button class=\"l3-seg\" data-h=\"3\" aria-pressed=\"false\">3 mo<\u002Fbutton>\n        <button class=\"l3-seg\" data-h=\"6\" aria-pressed=\"true\">6 mo<\u002Fbutton>\n        <button class=\"l3-seg\" data-h=\"12\" aria-pressed=\"false\">12 mo<\u002Fbutton>\n      <\u002Fdiv>\n      <div class=\"l3-card__readout\">\n        <div class=\"l3-card__readoutVal\" id=\"m1-val\">£3.32bn<\u002Fdiv>\n        <div class=\"l3-card__readoutLbl\">forecast horizon end<\u002Fdiv>\n        <div class=\"l3-card__delta up\" id=\"m1-delta\">↑ +5.7% vs base<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"l3-card__chart\" id=\"m1-chart\"><\u002Fdiv>\n      <details class=\"l3-method\"><summary>Methodology &amp; limitations<\u002Fsummary>\n        <p>OLS on 16 quarters, lagged consumer-confidence and £/$ inputs. R² ≈ 0.71. Limitations: structural break risk on Galaxy AI launch; correlation ≠ causation.<\u002Fp>\n      <\u002Fdetails>\n    <\u002Fdiv>\n\n    <!-- Module 2: Attrition risk matrix -->\n    <div class=\"l3-card\" id=\"m2\">\n      <div class=\"l3-card__h\">Module 2<\u002Fdiv>\n      <div class=\"l3-card__title\">Attrition Risk Score by Segment<\u002Fdiv>\n      <div class=\"l3-card__sub\">Tenure × role matrix. Cell colour = predicted 12-month departure probability.<\u002Fdiv>\n      <div class=\"l3-card__readout\">\n        <div class=\"l3-card__readoutVal\">412<\u002Fdiv>\n        <div class=\"l3-card__readoutLbl\">flagged employees · 6.9% of UK headcount<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"attr-matrix\" id=\"m2-matrix\"><\u002Fdiv>\n      <div style=\"margin-top:10px;display:flex;justify-content:space-between;font-size:11px;color:var(--text-muted)\">\n        <span>← Lower risk<\u002Fspan>\n        <span>Higher risk →<\u002Fspan>\n      <\u002Fdiv>\n      <details class=\"l3-method\"><summary>Methodology &amp; limitations<\u002Fsummary>\n        <p>Logistic regression on tenure, role, location, manager rating, last promotion. Davenport, Harris &amp; Shapiro (2010) — workforce-analytics maturity caveat: predictive ≠ prescriptive without intervention design.<\u002Fp>\n      <\u002Fdetails>\n    <\u002Fdiv>\n\n    <!-- Module 3: Wage inflation simulator -->\n    <div class=\"l3-card\" id=\"m3\">\n      <div class=\"l3-card__h\">Module 3<\u002Fdiv>\n      <div class=\"l3-card__title\">Wage Inflation · Margin Impact<\u002Fdiv>\n      <div class=\"l3-card__sub\">Live simulator. Move the slider to see UK margin impact compound through labour cost share and Services attach.<\u002Fdiv>\n      <div class=\"slider-row\">\n        <span class=\"slider-row__lbl\">UK wage inflation<\u002Fspan>\n        <span class=\"slider-row__val\" id=\"m3-w\">4.0%<\u002Fspan>\n        <input type=\"range\" class=\"slider\" id=\"m3-slider-w\" min=\"0\" max=\"10\" step=\"0.1\" value=\"4\">\n      <\u002Fdiv>\n      <div class=\"slider-row\">\n        <span class=\"slider-row__lbl\">Services attach uplift<\u002Fspan>\n        <span class=\"slider-row__val\" id=\"m3-s\">0.0%<\u002Fspan>\n        <input type=\"range\" class=\"slider\" id=\"m3-slider-s\" min=\"-3\" max=\"6\" step=\"0.1\" value=\"0\">\n      <\u002Fdiv>\n      <div class=\"l3-card__readout\">\n        <div class=\"l3-card__readoutVal\" id=\"m3-margin\">28.4%<\u002Fdiv>\n        <div class=\"l3-card__readoutLbl\">UK operating margin<\u002Fdiv>\n        <div class=\"l3-card__delta\" id=\"m3-delta\">→ baseline<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"l3-row\"><span class=\"l3-row__k\">Labour cost share<\u002Fspan><span class=\"l3-row__v\" id=\"m3-lc\">15.2%<\u002Fspan><\u002Fdiv>\n      <div class=\"l3-row\"><span class=\"l3-row__k\">Margin sensitivity<\u002Fspan><span class=\"l3-row__v\">−0.18pp per 1% wage<\u002Fspan><\u002Fdiv>\n      <details class=\"l3-method\"><summary>Methodology &amp; limitations<\u002Fsummary>\n        <p>Simple elasticity model: margin = base − β·Δwage + γ·Δattach. Holds revenue and FX constant. Doesn't capture price pass-through.<\u002Fp>\n      <\u002Fdetails>\n    <\u002Fdiv>\n\n    <!-- Module 4: Samsung launch impact -->\n    <div class=\"l3-card\" id=\"m4\">\n      <div class=\"l3-card__h\">Module 4<\u002Fdiv>\n      <div class=\"l3-card__title\">Galaxy S26 · Predicted UK Share Shift<\u002Fdiv>\n      <div class=\"l3-card__sub\">Calibrated on prior six Samsung launches · Counterpoint UK panel data · 6-week post-launch horizon.<\u002Fdiv>\n      <div class=\"slider-row\">\n        <span class=\"slider-row__lbl\">Apple counter-marketing intensity<\u002Fspan>\n        <span class=\"slider-row__val\" id=\"m4-w\">Medium<\u002Fspan>\n        <input type=\"range\" class=\"slider\" id=\"m4-slider\" min=\"0\" max=\"3\" step=\"1\" value=\"1\">\n      <\u002Fdiv>\n      <div class=\"l3-card__readout\">\n        <div class=\"l3-card__readoutVal\" id=\"m4-val\">−1.4pp<\u002Fdiv>\n        <div class=\"l3-card__readoutLbl\">predicted iOS share movement<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"l3-card__chart\" id=\"m4-chart\"><\u002Fdiv>\n      <details class=\"l3-method\"><summary>Methodology &amp; limitations<\u002Fsummary>\n        <p>Mean of six historical launch responses, scaled by feature-overlap index (Galaxy AI vs Apple Intelligence). Excludes Pixel 10 cross-pressure.<\u002Fp>\n      <\u002Fdetails>\n    <\u002Fdiv>\n\n    <!-- Module 5: Regulatory cost scenarios -->\n    <div class=\"l3-card\" id=\"m5\">\n      <div class=\"l3-card__h\">Module 5<\u002Fdiv>\n      <div class=\"l3-card__title\">DMA Compliance · Cost Scenarios<\u002Fdiv>\n      <div class=\"l3-card__sub\">Three pre-defined scenarios. Toggle to see revenue-at-risk and engineering investment.<\u002Fdiv>\n      <div class=\"l3-segs\" id=\"m5-segs\">\n        <button class=\"l3-seg\" data-s=\"0\" aria-pressed=\"true\">Minimal<\u002Fbutton>\n        <button class=\"l3-seg\" data-s=\"1\" aria-pressed=\"false\">Moderate<\u002Fbutton>\n        <button class=\"l3-seg\" data-s=\"2\" aria-pressed=\"false\">Full opening<\u002Fbutton>\n      <\u002Fdiv>\n      <div class=\"l3-card__readout\">\n        <div class=\"l3-card__readoutVal\" id=\"m5-val\">£42m<\u002Fdiv>\n        <div class=\"l3-card__readoutLbl\">UK revenue at risk<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"l3-row\"><span class=\"l3-row__k\">Engineering investment<\u002Fspan><span class=\"l3-row__v\" id=\"m5-eng\">£18m<\u002Fspan><\u002Fdiv>\n      <div class=\"l3-row\"><span class=\"l3-row__k\">Regulator-relations overhead<\u002Fspan><span class=\"l3-row__v\" id=\"m5-reg\">£3m / yr<\u002Fspan><\u002Fdiv>\n      <div class=\"l3-row\"><span class=\"l3-row__k\">Time to comply<\u002Fspan><span class=\"l3-row__v\" id=\"m5-time\">9 months<\u002Fspan><\u002Fdiv>\n      <details class=\"l3-method\"><summary>Methodology &amp; limitations<\u002Fsummary>\n        <p>EU DMA compliance cost as proxy, scaled by UK App Store revenue share. Excludes brand-equity impact.<\u002Fp>\n      <\u002Fdetails>\n    <\u002Fdiv>\n\n    <!-- Module 6: Scenario sandbox -->\n    <div class=\"l3-card\" id=\"m6\">\n      <div class=\"l3-card__h\">Module 6<\u002Fdiv>\n      <div class=\"l3-card__title\">Scenario Sandbox<\u002Fdiv>\n      <div class=\"l3-card__sub\">Set the three macro inputs. Outputs propagate live. Designed for pre-board off-site use.<\u002Fdiv>\n      <div class=\"slider-row\">\n        <span class=\"slider-row__lbl\">£/$ FX rate<\u002Fspan>\n        <span class=\"slider-row__val\" id=\"m6-fx\">1.27<\u002Fspan>\n        <input type=\"range\" class=\"slider\" id=\"m6-fx-s\" min=\"1.10\" max=\"1.45\" step=\"0.01\" value=\"1.27\">\n      <\u002Fdiv>\n      <div class=\"slider-row\">\n        <span class=\"slider-row__lbl\">UK wage inflation<\u002Fspan>\n        <span class=\"slider-row__val\" id=\"m6-wi\">4.0%<\u002Fspan>\n        <input type=\"range\" class=\"slider\" id=\"m6-wi-s\" min=\"0\" max=\"10\" step=\"0.1\" value=\"4\">\n      <\u002Fdiv>\n      <div class=\"slider-row\">\n        <span class=\"slider-row__lbl\">Services growth<\u002Fspan>\n        <span class=\"slider-row__val\" id=\"m6-sg\">+6.4%<\u002Fspan>\n        <input type=\"range\" class=\"slider\" id=\"m6-sg-s\" min=\"0\" max=\"20\" step=\"0.1\" value=\"6.4\">\n      <\u002Fdiv>\n      <div class=\"l3-card__readout\">\n        <div class=\"l3-card__readoutVal\" id=\"m6-rev\">£3.21bn<\u002Fdiv>\n        <div class=\"l3-card__readoutLbl\">forecast UK revenue · FY26<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"l3-row\"><span class=\"l3-row__k\">UK operating margin<\u002Fspan><span class=\"l3-row__v\" id=\"m6-mar\">28.6%<\u002Fspan><\u002Fdiv>\n      <div class=\"l3-row\"><span class=\"l3-row__k\">Engagement risk index<\u002Fspan><span class=\"l3-row__v\" id=\"m6-eng\">low<\u002Fspan><\u002Fdiv>\n      <details class=\"l3-method\"><summary>Methodology &amp; limitations<\u002Fsummary>\n        <p>Multiplicative composite: rev = base · (1 + α·ΔFX + β·Δsvc); margin = base − γ·Δwage. Holds competitor moves constant.<\u002Fp>\n      <\u002Fdetails>\n    <\u002Fdiv>\n  `;\n\n  // wire modules\n  wireModule1();\n  wireModule2();\n  wireModule3();\n  wireModule4();\n  wireModule5();\n  wireModule6();\n}\n\nfunction fanChart(target, history, base, horizon) {\n  const w = 320, h = 110, pad = 6;\n  const pts = [...history];\n  for (let i = 1; i <= horizon; i++) {\n    const last = pts[pts.length - 1];\n    pts.push(last * (1 + base/horizon/100));\n  }\n  const min = Math.min(...pts) * 0.96, max = Math.max(...pts) * 1.04;\n  const range = max - min;\n  const xy = pts.map((v, i) => {\n    const x = (i / (pts.length - 1)) * w;\n    const y = h - ((v - min) / range) * (h - pad*2) - pad;\n    return [x, y];\n  });\n  const histLen = history.length;\n  const histLine = xy.slice(0, histLen).map(p => p.join(',')).join(' ');\n  const fcLine = xy.slice(histLen-1).map(p => p.join(',')).join(' ');\n  // confidence band\n  const upper = xy.slice(histLen-1).map((p,i) => [p[0], p[1] - i * 1.4]);\n  const lower = xy.slice(histLen-1).map((p,i) => [p[0], p[1] + i * 1.4]);\n  const band = `M ${upper.map(p=>p.join(',')).join(' L ')} L ${lower.slice().reverse().map(p=>p.join(',')).join(' L ')} Z`;\n  const splitX = xy[histLen-1][0];\n  target.innerHTML = `<svg viewBox=\"0 0 ${w} ${h}\" preserveAspectRatio=\"none\">\n    <path d=\"${band}\" fill=\"var(--accent)\" opacity=\"0.14\" />\n    <line x1=\"${splitX}\" y1=\"0\" x2=\"${splitX}\" y2=\"${h}\" stroke=\"var(--separator)\" stroke-dasharray=\"2 3\" />\n    <polyline points=\"${histLine}\" stroke=\"var(--accent)\" stroke-width=\"1.8\" fill=\"none\" stroke-linejoin=\"round\" />\n    <polyline points=\"${fcLine}\" stroke=\"var(--accent)\" stroke-width=\"1.8\" stroke-dasharray=\"3 3\" fill=\"none\" stroke-linejoin=\"round\" />\n  <\u002Fsvg>`;\n}\n\nfunction wireModule1() {\n  const segs = document.querySelectorAll('#m1 .l3-seg');\n  const chart = document.getElementById('m1-chart');\n  const val = document.getElementById('m1-val'), delta = document.getElementById('m1-delta');\n  const history = [2.85, 2.92, 2.96, 3.04, 3.08, 3.10, 3.12, 3.14];\n  function render(h) {\n    fanChart(chart, history, 5.7, h);\n    const end = history[history.length-1] * (1 + 5.7/100 * (h/12));\n    val.textContent = '£' + end.toFixed(2) + 'bn';\n    const pct = ((end - history[history.length-1]) / history[history.length-1]) * 100;\n    delta.textContent = `↑ +${pct.toFixed(1)}% vs current`;\n  }\n  segs.forEach(b => b.addEventListener('click', () => {\n    segs.forEach(x => x.setAttribute('aria-pressed','false'));\n    b.setAttribute('aria-pressed','true');\n    render(+b.dataset.h);\n  }));\n  render(6);\n}\n\nfunction wireModule2() {\n  const grid = document.getElementById('m2-matrix');\n  // 4×3 cells: rows = tenure bands, cols = roles\n  const roles = [\"Retail floor\",\"Genius\",\"Corporate\",\"Leadership\"];\n  const tenures = [\"<12m\",\"1–3y\",\"3–7y\",\"7y+\"];\n  const matrix = [\n    [3,2,1,0], // <12m\n    [3,1,1,0],\n    [2,1,0,0],\n    [1,0,0,0]\n  ];\n  const lvl = [\"low\",\"med\",\"high\",\"vhi\"];\n  const html = matrix.flatMap((row,r)=>\n    row.map((v,c) => `<div class=\"attr-cell attr-cell--${lvl[v]}\" title=\"${tenures[r]} · ${roles[c]} — ${(v*8+5).toFixed(0)}% risk\">${(v*8+5).toFixed(0)}%<\u002Fdiv>`)\n  ).join('');\n  grid.innerHTML = html;\n}\n\nfunction wireModule3() {\n  const wEl = document.getElementById('m3-slider-w'), sEl = document.getElementById('m3-slider-s');\n  const wOut = document.getElementById('m3-w'), sOut = document.getElementById('m3-s');\n  const margin = document.getElementById('m3-margin'), delta = document.getElementById('m3-delta'), lc = document.getElementById('m3-lc');\n  function recalc() {\n    const w = +wEl.value, s = +sEl.value;\n    wOut.textContent = w.toFixed(1) + '%';\n    sOut.textContent = (s>=0?'+':'') + s.toFixed(1) + '%';\n    const baseMargin = 28.4, baseWage = 4.0;\n    const m = baseMargin - 0.18*(w - baseWage) + 0.22*s;\n    margin.textContent = m.toFixed(1) + '%';\n    const d = m - baseMargin;\n    delta.textContent = (d>=0?'↑ +':'↓ ') + d.toFixed(2) + 'pp vs baseline';\n    delta.className = 'l3-card__delta ' + (d>0?'up':d<0?'down':'');\n    lc.textContent = (15.2 + (w-baseWage)*0.4).toFixed(1) + '%';\n  }\n  wEl.addEventListener('input', recalc);\n  sEl.addEventListener('input', recalc);\n  recalc();\n}\n\nfunction wireModule4() {\n  const sl = document.getElementById('m4-slider');\n  const lbl = document.getElementById('m4-w'), val = document.getElementById('m4-val');\n  const chart = document.getElementById('m4-chart');\n  const labels = [\"None\",\"Light\",\"Medium\",\"Heavy\"];\n  const shifts = [-2.4, -1.8, -1.4, -0.7];\n  function render() {\n    const i = +sl.value;\n    lbl.textContent = labels[i];\n    val.textContent = shifts[i].toFixed(1) + 'pp';\n    // simple 6-week trajectory\n    const w = 320, h = 110, pad = 6, pts = [];\n    for (let k = 0; k <= 6; k++) pts.push(52 + (shifts[i] * (k/6)));\n    const min = 49, max = 53, range = max - min;\n    const xy = pts.map((v, j) => [(j / 6) * w, h - ((v - min)/range) * (h - pad*2) - pad]);\n    chart.innerHTML = `<svg viewBox=\"0 0 ${w} ${h}\" preserveAspectRatio=\"none\">\n      <line x1=\"0\" y1=\"${h - ((52-min)/range)*(h-pad*2)-pad}\" x2=\"${w}\" y2=\"${h - ((52-min)/range)*(h-pad*2)-pad}\" stroke=\"var(--separator)\" stroke-dasharray=\"2 3\" />\n      <polyline points=\"${xy.map(p=>p.join(',')).join(' ')}\" stroke=\"var(--accent)\" stroke-width=\"1.8\" fill=\"none\" stroke-linejoin=\"round\" />\n    <\u002Fsvg>`;\n  }\n  sl.addEventListener('input', render);\n  render();\n}\n\nfunction wireModule5() {\n  const segs = document.querySelectorAll('#m5-segs .l3-seg');\n  const scenarios = [\n    { val:\"£42m\", eng:\"£18m\", reg:\"£3m / yr\", time:\"9 months\" },\n    { val:\"£128m\", eng:\"£64m\", reg:\"£8m / yr\", time:\"14 months\" },\n    { val:\"£310m\", eng:\"£140m\", reg:\"£18m / yr\", time:\"22 months\" }\n  ];\n  segs.forEach(b => b.addEventListener('click', () => {\n    segs.forEach(x => x.setAttribute('aria-pressed','false'));\n    b.setAttribute('aria-pressed','true');\n    const s = scenarios[+b.dataset.s];\n    document.getElementById('m5-val').textContent = s.val;\n    document.getElementById('m5-eng').textContent = s.eng;\n    document.getElementById('m5-reg').textContent = s.reg;\n    document.getElementById('m5-time').textContent = s.time;\n  }));\n}\n\nfunction wireModule6() {\n  const fx = document.getElementById('m6-fx-s'), wi = document.getElementById('m6-wi-s'), sg = document.getElementById('m6-sg-s');\n  const fxO = document.getElementById('m6-fx'), wiO = document.getElementById('m6-wi'), sgO = document.getElementById('m6-sg');\n  const rev = document.getElementById('m6-rev'), mar = document.getElementById('m6-mar'), eng = document.getElementById('m6-eng');\n  function recalc() {\n    const fxV = +fx.value, wiV = +wi.value, sgV = +sg.value;\n    fxO.textContent = fxV.toFixed(2);\n    wiO.textContent = wiV.toFixed(1) + '%';\n    sgO.textContent = '+' + sgV.toFixed(1) + '%';\n    const baseRev = 3.14, baseMar = 28.4, baseW = 4.0, baseS = 6.4, baseFX = 1.27;\n    const r = baseRev * (1 + (fxV - baseFX) * 0.6 + (sgV - baseS) * 0.014);\n    const m = baseMar - 0.18*(wiV - baseW) + 0.10*(sgV - baseS);\n    rev.textContent = '£' + r.toFixed(2) + 'bn';\n    mar.textContent = m.toFixed(1) + '%';\n    eng.textContent = wiV > 7 ? 'high' : wiV > 5 ? 'elevated' : 'low';\n  }\n  [fx, wi, sg].forEach(el => el.addEventListener('input', recalc));\n  recalc();\n}\n\n/* ── Live data simulation ────────────────────── */\nfunction startLiveSim() {\n  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;\n  setInterval(() => {\n    if (!document.getElementById('level-1').classList.contains('is-hidden')) {\n      const candidates = document.querySelectorAll('#tileGrid .tile__value[data-numeric]');\n      if (!candidates.length) return;\n      const pick = candidates[Math.floor(Math.random() * candidates.length)];\n      const cur = parseFloat(pick.dataset.numeric);\n      if (isNaN(cur)) return;\n      const drift = (Math.random() - 0.5) * Math.max(Math.abs(cur) * 0.004, 0.02);\n      const next = cur + drift;\n      const dec = +pick.dataset.decimals || 0;\n      const pre = pick.dataset.prefix || '', suf = pick.dataset.suffix || '';\n      pick.classList.add('is-nudging');\n      setTimeout(() => {\n        pick.dataset.numeric = next.toFixed(dec+2);\n        pick.textContent = pre + next.toFixed(dec) + suf;\n        pick.classList.remove('is-nudging');\n      }, 220);\n    }\n  }, 2400);\n}\n\n/* ── Theme + init ────────────────────────────── */\nfunction setTheme(theme) {\n  document.documentElement.setAttribute('data-theme', theme);\n  document.getElementById('themeToggleLabel').textContent = theme === 'dark' ? 'Light' : 'Dark';\n  try { localStorage.setItem('apple-uk-theme', theme); } catch(_) {}\n}\n\nfunction init() {\n  let stored = null;\n  try { stored = localStorage.getItem('apple-uk-theme'); } catch(_) {}\n  const initialTheme = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');\n  setTheme(initialTheme);\n\n  renderLevel1();\n  renderLevel2();\n  renderLevel3();\n\n  // Role\n  document.getElementById('roleSelect').addEventListener('change', e => { state.role = e.target.value; renderLevel1(); });\n\n  // Theme\n  document.getElementById('themeToggle').addEventListener('click', () => {\n    const cur = document.documentElement.getAttribute('data-theme') || 'light';\n    setTheme(cur === 'dark' ? 'light' : 'dark');\n  });\n\n  // Levels\n  document.querySelectorAll('.level-switcher__btn').forEach(btn => {\n    btn.addEventListener('click', () => {\n      document.querySelectorAll('.level-switcher__btn').forEach(b => {\n        b.removeAttribute('aria-current'); b.setAttribute('aria-selected', 'false');\n      });\n      btn.setAttribute('aria-current', 'page'); btn.setAttribute('aria-selected', 'true');\n      document.querySelectorAll('.level-section').forEach(s => s.classList.add('is-hidden'));\n      document.getElementById('level-' + btn.dataset.level).classList.remove('is-hidden');\n      window.scrollTo({ top: 0, behavior: 'smooth' });\n    });\n  });\n\n  // Filters\n  function chipActive(name, isActive) {\n    const c = document.querySelector(`.filter-chip[data-filter=\"${name}\"]`);\n    if (c) c.dataset.active = isActive ? 'true' : 'false';\n  }\n  function onFilterChange() {\n    state.filters.period = document.getElementById('filterPeriod').value;\n    state.filters.bu     = document.getElementById('filterBU').value;\n    state.filters.geo    = document.getElementById('filterGeo').value;\n    state.filters.cohort = document.getElementById('filterCohort').value;\n    chipActive('period', state.filters.period !== '12M');\n    chipActive('bu', state.filters.bu !== 'All');\n    chipActive('geo', state.filters.geo !== 'UK');\n    chipActive('cohort', state.filters.cohort !== 'All staff');\n    const map = { 'Q':'Q2 FY26 (Jan–Mar 2026)', 'YTD':'FY26 YTD (Oct 2025–present)', '12M':'Trailing 12M to Q2 FY26', 'Custom':'Custom range' };\n    document.getElementById('reportingPeriod').textContent = map[state.filters.period] || 'Trailing 12M to Q2 FY26';\n    renderLevel1();\n  }\n  ['filterPeriod','filterBU','filterGeo','filterCohort'].forEach(id => {\n    document.getElementById(id).addEventListener('change', onFilterChange);\n  });\n  document.getElementById('filterReset').addEventListener('click', () => {\n    document.getElementById('filterPeriod').value = '12M';\n    document.getElementById('filterBU').value = 'All';\n    document.getElementById('filterGeo').value = 'UK';\n    document.getElementById('filterCohort').value = 'All staff';\n    onFilterChange();\n  });\n\n  // Sheet close\n  document.getElementById('sheetClose').addEventListener('click', closeSheet);\n  document.getElementById('sheetBackdrop').addEventListener('click', closeSheet);\n  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });\n\n  // Keyboard shortcuts\n  document.addEventListener('keydown', e => {\n    if (/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;\n    if (['1','2','3'].includes(e.key)) {\n      const b = document.querySelector(`.level-switcher__btn[data-level=\"${e.key}\"]`);\n      if (b) b.click();\n    } else if (e.key === 't' || e.key === 'T') {\n      document.getElementById('themeToggle').click();\n    } else if (e.key === 'r' || e.key === 'R') {\n      const sel = document.getElementById('roleSelect');\n      const opts = Array.from(sel.options).map(o => o.value);\n      sel.value = opts[(opts.indexOf(sel.value) + 1) % opts.length];\n      sel.dispatchEvent(new Event('change'));\n    }\n  });\n\n  startLiveSim();\n}\n\ndocument.addEventListener('DOMContentLoaded', init);\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
